<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문서를 여는 중입니다 | 한국AI윤리위원회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://skkc.co.kr">
<style>
html,body{margin:0;height:100%;background:#fff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:16vh;box-sizing:border-box;
  font:600 16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2433}
.spin{width:34px;height:34px;box-sizing:border-box;border:3px solid #d9e1ee;border-top-color:#1f5fe0;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#1f5fe0;font-weight:500;font-size:14px}
[hidden]{display:none}
</style>
<script>
(function () {
  var DEST = "https://skkc.co.kr/shop_view?idx=26&kaiec_buy=1", LAPI = "https://script.google.com/macros/s/AKfycbw3ZPLXHv92tfNVs7caH-Bf1OvMesqh0RfR8y4LCsT5DaE3otEbGWhyFLIY6FqoBEY/exec";
  var c = '';
  try { c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); } catch (e) {}
  var ok = /^[A-Z]{2,4}\d{4}$/.test(c);
  var url = DEST + (ok ? (DEST.indexOf('?') > -1 ? '&' : '?') + 'kaiec_ref=' + c : '');
  window.__goURL = url;
  /* 위원 활동 시스템(2026.09.29): 명함 QR 스캔을 리치 신호로 (위원 본인 브라우저는 제외, 응답은 기다리지 않음) */
  if (ok && LAPI && window.fetch) {
    try {
      if (!localStorage.getItem('kaiec_lounge_token')) {
        var v = localStorage.getItem('kaiec_vid'); if (!v) { v = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('kaiec_vid', v); }
        fetch(LAPI, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'reach', code: c, vid: v, path: '/go/' }), keepalive: true, redirect: 'follow' }).catch(function () {});
      }
    } catch (e) {}
  }
  location.replace(url);
})();
</script>
</head><body>
<span class="spin" aria-hidden="true"></span>
<span role="status">주문서를 여는 중입니다</span>
<a id="go" href="https://skkc.co.kr/shop_view?idx=26&amp;kaiec_buy=1" hidden>넘어가지 않으면 여기를 눌러 주세요</a>
<script>
setTimeout(function () { var a = document.getElementById('go'); if (window.__goURL) a.href = window.__goURL; a.hidden = false; }, 4000);
</script>
<noscript><a href="https://skkc.co.kr/shop_view?idx=26&amp;kaiec_buy=1">AI윤리전문가 양성과정 주문서로 이동</a></noscript>
</body></html>
