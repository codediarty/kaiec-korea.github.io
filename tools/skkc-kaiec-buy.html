<!-- KAIEC 결제 바로 연결 + 추천 위원 코드 자동 입력 (성균관컨설팅 skkc.co.kr 아임웹에 한 번만 넣는 코드, 2026.09.26 v3)
     넣는 곳: 아임웹 관리자 > 설정 > SEO > 고급 설정 > Footer Code (모든 페이지 </body> 바로 위). 예전 코드가 있으면 이 코드로 통째로 바꿉니다.
     하는 일
       1) kaiec.kr 위원 명함에서 넘어온 주소에 kaiec_ref=위원코드(예: PKH3185)가 있으면 이 탭에 3시간 동안 기억합니다.
       2) 상품 화면(shop_view?idx=…&kaiec_buy=1)이면 [구매하기]를 대신 눌러 비회원 주문서(shop_payment)로 바로 보냅니다.
       3) 주문서의 '주문 추가 정보' 칸을 상품에 맞게 보여 줍니다.
          - '추천 위원 코드' 칸: AI윤리전문가 양성과정 주문에서만 보이고, 카피클린 · 성균관컨설팅 주문에서는 숨깁니다.
            명함에서 온 구매자면 기억한 위원 코드를 이 칸에 자동으로 채웁니다.
            (칸이 없고 같은 이름의 쿠폰 코드가 등록돼 있으면 쿠폰 칸에 넣어 적용합니다.)
          - '카피클린 전용' · '결과 수령 이메일' 칸: 양성과정만 주문할 때는 숨깁니다. 단, 필수 항목이면 숨기지 않습니다
            (필수 칸을 숨기면 결제가 막히므로, 숨기려면 주문 추가 정보에서 필수를 꺼 주세요).
     다른 방문자와 다른 페이지에는 영향이 없습니다. 주문서 주소(order_code · order_no · order_member)는 구매자마다 새로 만들어지므로
     고정 링크로 걸 수 없어 이렇게 처리합니다. -->
<script>
(function () {
  var KEY = 'kaiec_ref', TTL = 3 * 60 * 60 * 1000;
  var AIEP_IDX = ['26'];                 /* AI윤리전문가 양성과정 상품 번호 (shop_view?idx=26) */
  var REF_RE = /추천\s*위원|위원\s*코드|추천\s*코드|추천인/;
  var CC_RE = /카피클린\s*전용|결과\s*수령\s*이메일/;
  var params = new URLSearchParams(location.search);

  /* 1) 위원 코드 기억 + 주소 정리 (뒤로 가기로 돌아와도 주문서를 또 만들지 않도록 kaiec_buy 도 먼저 지움) */
  var ref = (params.get('kaiec_ref') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (/^[A-Z]{2,4}\d{4}$/.test(ref)) {
    try { sessionStorage.setItem(KEY, JSON.stringify({ code: ref, t: Date.now() })); } catch (e) {}
  }
  var wantBuy = params.get('kaiec_buy') === '1' && location.pathname.indexOf('/shop_view') === 0;
  if (params.has('kaiec_ref') || params.has('kaiec_buy')) {
    params.delete('kaiec_ref'); params.delete('kaiec_buy');
    var qs = params.toString();
    try { history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '') + location.hash); } catch (e) {}
  }
  function storedCode() {
    try {
      var v = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (v && v.code && Date.now() - v.t < TTL) return v.code;
    } catch (e) {}
    return '';
  }

  /* 2) 상품 화면: [구매하기]를 대신 눌러 비회원 주문서로 */
  if (wantBuy) {
    var cleanUrl = location.origin + location.pathname + (params.toString() ? '?' + params.toString() : '');
    var cover = document.createElement('div');
    cover.id = 'kaiecBuyCover';
    cover.setAttribute('role', 'status');
    cover.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483646;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(255,255,255,.97);text-align:center;' +
      'font:600 16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2433');
    cover.innerHTML = '<style>@keyframes kaiecBuySpin{to{transform:rotate(360deg)}}</style>' +
      '<span style="width:34px;height:34px;border:3px solid #d9e1ee;border-top-color:#1f5fe0;border-radius:50%;animation:kaiecBuySpin .8s linear infinite"></span>' +
      '<span>주문서를 여는 중입니다</span>' +
      '<span style="font-weight:500;font-size:13px;color:#6b7383">AI윤리전문가 양성과정 · 회원가입 없이 비회원으로 주문합니다</span>';
    var showCover = function () { if (document.body && !cover.parentNode) document.body.appendChild(cover); };
    var hideCover = function () { if (cover.parentNode) cover.parentNode.removeChild(cover); };
    var started = Date.now(), fired = false;
    var ready = function () {
      var d = window.SITE_SHOP_DETAIL;
      if (!d || typeof d.confirmOrderWithCartItems !== 'function' || document.readyState !== 'complete') return false;
      /* 상품 수량이 준비된 뒤에 눌러야 주문이 만들어집니다 (옵션 불러오기가 끝나면 1) */
      return typeof d.getOrderCount !== 'function' || d.getOrderCount() > 0;
    };
    var tick = function () {
      if (fired) return;
      showCover();
      if (ready()) {
        fired = true;
        try { window.SITE_SHOP_DETAIL.confirmOrderWithCartItems('guest_login', cleanUrl); } catch (e) { hideCover(); return; }
        /* 품절·오류 등으로 주문서로 넘어가지 못하면 가림막을 걷어 직접 [구매하기]를 누를 수 있게 합니다 */
        setTimeout(hideCover, 8000);
        return;
      }
      if (Date.now() - started < 12000) setTimeout(tick, 150); else hideCover();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick); else tick();
    window.addEventListener('pageshow', function (e) { if (e.persisted) hideCover(); });
    return;
  }

  /* 3) 주문서 */
  if (location.pathname.indexOf('/shop_payment') !== 0) return;
  var code = storedCode();

  /* 주문 상품 목록: 썸네일이 있는 li > a[href="/shop_view/?idx=번호"] */
  function orderItems() {
    var out = [], links = document.querySelectorAll('li a[href^="/shop_view/?idx="]');
    for (var i = 0; i < links.length; i++) {
      if (!links[i].querySelector('img')) continue;
      var m = /idx=(\d+)/.exec(links[i].getAttribute('href') || '');
      out.push({ idx: m ? m[1] : '', name: (links[i].textContent || '').trim() });
    }
    return out;
  }
  function isAiep(it) { return AIEP_IDX.indexOf(it.idx) >= 0 || it.name.indexOf('AI윤리전문가') >= 0; }
  /* 주문 추가 정보 칸: form 바로 아래 칸 묶음(제목 p, 필수면 제목 옆 점 em) */
  function fieldBoxes() {
    var res = [], list = document.querySelectorAll('form input, form textarea');
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (/^(hidden|radio|checkbox|submit|button)$/i.test(el.type || '') || /쿠폰/.test(el.placeholder || '') || /^orderer/i.test(el.name || '')) continue;
      var box = el, d = 0;
      while (box.parentElement && box.parentElement.tagName !== 'FORM' && d < 8) { box = box.parentElement; d++; }
      if (box === el || !box.parentElement || box.parentElement.tagName !== 'FORM') continue;
      var dup = false;
      for (var j = 0; j < res.length; j++) if (res[j].box === box) dup = true;
      if (dup) continue;
      var p = box.querySelector('p');
      res.push({ box: box, form: box.parentElement, input: el, title: p ? (p.textContent || '').trim() : '', required: !!(p && p.querySelector('em')) });
    }
    return res;
  }
  function setHidden(el, hide) {
    if (hide) { el.style.display = 'none'; el.setAttribute('data-kaiec-hidden', '1'); }
    else if (el.getAttribute('data-kaiec-hidden')) { el.style.display = ''; el.removeAttribute('data-kaiec-hidden'); }
  }
  var state = { aiep: false, ready: false };
  function applyRules() {
    var items = orderItems();
    if (!items.length) return;
    state.ready = true;
    state.aiep = items.some(isAiep);
    var onlyAiep = items.every(isAiep), boxes = fieldBoxes(), forms = [];
    for (var i = 0; i < boxes.length; i++) {
      var f = boxes[i], hide = null;
      if (REF_RE.test(f.title)) hide = !state.aiep;
      else if (CC_RE.test(f.title)) hide = onlyAiep && !f.required;   /* 필수 칸은 숨기면 결제가 막히므로 그대로 둠 */
      if (hide !== null) setHidden(f.box, hide);
      if (forms.indexOf(f.form) < 0) forms.push(f.form);
    }
    /* 칸이 모두 숨겨졌으면 '추가정보 입력' 제목까지 숨김 */
    for (var k = 0; k < forms.length; k++) {
      var fm = forms[k], all = true;
      for (var b = 0; b < boxes.length; b++) if (boxes[b].form === fm && !boxes[b].box.getAttribute('data-kaiec-hidden')) all = false;
      /* 제목 '추가정보 입력'을 품은 가장 바깥 칸까지 (숨긴 칸은 innerText 가 비므로 textContent 로 판단) */
      var sec = fm.parentElement, top = null;
      while (sec && /^\s*추가\s*정보/.test(sec.textContent || '')) { top = sec; sec = sec.parentElement; }
      if (top) setHidden(top, all);
    }
  }

  function setVal(el, v) {
    var proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    var desc = Object.getOwnPropertyDescriptor(proto, 'value');
    if (desc && desc.set) desc.set.call(el, v); else el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.setAttribute('role', 'status');
    t.setAttribute('style', 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483646;max-width:calc(100% - 32px);' +
      'padding:11px 16px;border-radius:10px;background:#0A1628;color:#fff;box-shadow:0 8px 24px rgba(10,22,40,.25);' +
      'font:600 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 4500);
  }
  function refField() {
    var boxes = fieldBoxes();
    for (var i = 0; i < boxes.length; i++) {
      var inp = boxes[i].input;
      if (REF_RE.test(boxes[i].title) && (inp.tagName === 'TEXTAREA' || /^text$/i.test(inp.type || 'text'))) return inp;
    }
    return null;
  }
  function couponInput() {
    var list = document.querySelectorAll('input');
    for (var i = 0; i < list.length; i++) if (/쿠폰/.test(list[i].placeholder || '')) return list[i];
    return null;
  }
  /* 같은 이름의 쿠폰 코드가 등록돼 있는지 주문 금액 계산으로만 확인 (등록돼 있지 않으면 쿠폰 칸은 건드리지 않아 오류 창이 뜨지 않음) */
  function couponExists(c) {
    var tok = '', no = new URLSearchParams(location.search).get('order_no');
    try { tok = sessionStorage.getItem('oms_token') || ''; } catch (e) {}
    if (!tok || !no || !window.fetch) return Promise.resolve(false);
    var body = { inputCouponCode: c }, gm = new URLSearchParams(location.search).get('order_member');
    if (gm) body.guestMemberCode = gm;
    return fetch('https://api.oms.imweb.me/customer/v1/orders/' + encodeURIComponent(no) + '/amount-due', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + tok },
      body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return !!(j && j.data && j.data.totalInputCouponDiscount >= 0); })
      .catch(function () { return false; });
  }

  var t0 = Date.now(), filled = !code, couponChecked = false, couponSeenAt = 0;
  function fill() {
    if (filled || !state.ready || !state.aiep) return;
    var f = refField();
    if (f) {
      filled = true;
      if (!f.value) { setVal(f, code); toast('추천 위원 코드 ' + code + ' 가 자동으로 입력되었습니다'); }
      return;
    }
    var ci = couponInput();
    if (ci && !couponSeenAt) couponSeenAt = Date.now();
    /* 추가 정보 칸이 그려질 시간을 조금 준 뒤 쿠폰 코드로 확인 */
    if (ci && !couponChecked && Date.now() - couponSeenAt > 1500) {
      couponChecked = true;
      couponExists(code).then(function (ok) {
        if (!ok || filled || ci.value) return;
        filled = true;
        setVal(ci, code);
        var form = ci.closest('form'), btn = form && form.querySelector('button[type="submit"]');
        if (btn) btn.click(); else if (form && form.requestSubmit) form.requestSubmit();
        toast('추천 위원 코드 ' + code + ' 가 적용되었습니다');
      });
    }
  }
  function run() {
    applyRules();
    fill();
    /* 주문서가 다시 그려져도 규칙이 유지되도록 2분 동안 가볍게 다시 적용 */
    if (Date.now() - t0 < 120000) setTimeout(run, Date.now() - t0 < 20000 ? 400 : 1500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>
